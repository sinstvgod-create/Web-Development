<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | OverloadFit</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <a href="login.html" class="back-home-btn" title="Back to Login">
        <i class="bi bi-arrow-left"></i>
    </a>

    <div class="auth-card">
        <div class="logo">
            <i class="bi bi-lightning-charge-fill"></i>
            OVERLOAD<span>FIT</span>
        </div>

        <div id="verifyPhoneStep">
            <h1>Forgot Password</h1>
            <p>Enter your registered phone number to verify your account.</p>

            <form id="verifyPhoneForm" novalidate>
                <div class="input-box">
                    <label for="resetPhone">Registered Phone Number</label>
                    <input type="tel" id="resetPhone" placeholder="Enter 10-digit phone number" required pattern="[0-9]{10}">
                    <span class="field-error" id="resetPhoneError" style="color: #ff5252; font-size: 0.8rem; display: none;"></span>
                </div>

                <p id="verifyMessage" style="margin-top: 10px; font-size: 0.9rem; min-height: 20px;"></p>

                <button type="submit" id="verifyBtn">Verify Phone Number</button>
            </form>
        </div>

        <div id="resetPasswordStep" style="display: none;">
            <h1>Create New Password</h1>
            <p>Set a new password for your OverloadFit account.</p>

            <form id="resetPasswordForm" novalidate>
                <div class="input-box" style="position: relative;">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password (min 6 chars)" required minlength="6">
                    <i class="bi bi-eye-slash" id="toggleNewPasswordBtn" style="position: absolute; right: 15px; top: 38px; cursor: pointer; color: #a0a0a0;"></i>
                    <span class="field-error" id="newPasswordError" style="color: #ff5252; font-size: 0.8rem; display: none;"></span>
                </div>

                <div class="input-box" style="position: relative;">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter new password" required minlength="6">
                    <i class="bi bi-eye-slash" id="toggleConfirmPasswordBtn" style="position: absolute; right: 15px; top: 38px; cursor: pointer; color: #a0a0a0;"></i>
                    <span class="field-error" id="confirmPasswordError" style="color: #ff5252; font-size: 0.8rem; display: none;"></span>
                </div>

                <p id="resetMessage" style="margin-top: 10px; font-size: 0.9rem; min-height: 20px;"></p>

                <button type="submit" id="saveNewPasswordBtn">Update Password</button>
            </form>
        </div>

        <p class="switch" style="margin-top: 20px;">Remembered your password? <a href="login.html">Login</a></p>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const setupToggle = (btnId, inputId) => {
                const btn = document.getElementById(btnId);
                const input = document.getElementById(inputId);
                if (btn && input) {
                    btn.addEventListener('click', () => {
                        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                        input.setAttribute('type', type);
                        btn.classList.toggle('bi-eye');
                        btn.classList.toggle('bi-eye-slash');
                    });
                }
            };

            setupToggle('toggleNewPasswordBtn', 'newPassword');
            setupToggle('toggleConfirmPasswordBtn', 'confirmPassword');
        });
    </script>
</body>

</html>

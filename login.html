<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | OverloadFit</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <a href="index.html" class="back-home-btn" title="Back to Home">
        <i class="bi bi-arrow-left"></i>
    </a>

    <div class="auth-card">
        <div class="logo">
            <i class="bi bi-lightning-charge-fill"></i>
            OVERLOAD<span>FIT</span>
        </div>

        <h1>Welcome Back</h1>
        <p>Login to continue your transformation.</p>

        <form id="loginForm" novalidate>
            <div class="input-box">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="Enter email" required autocomplete="email">
                <span class="field-error" id="emailError" style="color: #ff5252; font-size: 0.8rem; display: none;"></span>
            </div>

            <div class="input-box" style="position: relative;">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required autocomplete="current-password">
                <i class="bi bi-eye-slash" id="togglePasswordBtn" style="position: absolute; right: 15px; top: 38px; cursor: pointer; color: #a0a0a0;"></i>
                <span class="field-error" id="passwordError" style="color: #ff5252; font-size: 0.8rem; display: none;"></span>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin: -10px 0 15px 0;">
                <div class="terms-checkbox-group" style="margin: 0;">
                    <input type="checkbox" id="loginTerms" required>
                    <label for="loginTerms">I agree with <a href="TandC.html">Terms</a></label>
                </div>
                <a href="forgot-password.html" style="color: var(--blue); font-size: 13.5px; text-decoration: none; font-weight: 500;">Forgot Password?</a>
            </div>

            <p id="loginMessage" style="margin-top: 10px; font-size: 0.9rem; min-height: 20px;"></p>

            <button type="submit" id="loginSubmitBtn">Login</button>
        </form>

        <p class="switch">Don't have an account? <a href="register.html">Create Account</a></p>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const passwordInput = document.getElementById('loginPassword');

            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', () => {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    toggleBtn.classList.toggle('bi-eye');
                    toggleBtn.classList.toggle('bi-eye-slash');
                });
            }
        });
    </script>
</body>

</html>
